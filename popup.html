<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Color Collapse for Fabletics</title>
<style>
  :root {
    --bg: #ffffff; --fg: #111111; --muted: #6b6b6b; --line: #e6e6e6;
    --accent: #00d8e6; --magenta: #ff00ff; --yellow: #ffee00;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111111; --fg: #f4f4f4; --muted: #9a9a9a; --line: #2a2a2a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 280px; background: var(--bg); color: var(--fg);
         font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
  header img { width: 28px; height: 28px; }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  .row { display: flex; align-items: center; justify-content: space-between;
         padding: 10px 16px; border-top: 1px solid var(--line); gap: 12px; }
  .row label { flex: 1; }
  .row small { display: block; color: var(--muted); }
  select { font: inherit; color: var(--fg); background: var(--bg);
           border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  .switch { position: relative; width: 38px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: #bdbdbd; border-radius: 22px; transition: .15s; }
  .switch span::after { content: ""; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px;
                        background: #fff; border-radius: 50%; transition: .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(16px); }
  footer { padding: 10px 16px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .off { opacity: .5; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon128.png" alt="">
    <h1>Color Collapse for Fabletics</h1>
  </header>

  <div class="row">
    <label for="enabled">Collapse colors<small>One card per product</small></label>
    <span class="switch"><input type="checkbox" id="enabled"><span></span></span>
  </div>
  <div class="row" id="optRows">
    <label for="mergeByName">Also merge by name<small>Catches re-issued styles with new codes</small></label>
    <span class="switch"><input type="checkbox" id="mergeByName"><span></span></span>
  </div>
  <div class="row">
    <label for="pick">Color to show<small>Which color survives</small></label>
    <select id="pick">
      <option value="first">First listed</option>
      <option value="mostSizes">Most sizes in stock</option>
    </select>
  </div>
  <footer id="note">Changes reload the current Fabletics tab.</footer>
  <script src="popup.js"></script>
</body>
</html>
